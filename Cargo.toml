[package]
name = "wdill"
version = "0.4.0"
edition = "2024"
description = "A tiny 3D printfile viewer for GNOME (.stl, .3mf, .obj, .step, .glb, .fbx)"
license = "GPL-3.0-or-later"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
bytemuck = "1.25.2"
cairo-rs = { version = "0.22.0", features = ["png"] }
glam = "0.33.2"
gltf = { version = "1.4.1", default-features = false, features = ["utils"] }
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_10"] }
quick-xml = "0.41.0"
rayon = "1.12.0"
truck-meshalgo = { version = "0.4.0", default-features = false, features = ["tessellation"] }
truck-stepio = "0.3.0"
ufbx = "0.11.5"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
truck-modeling = "0.6.0"
